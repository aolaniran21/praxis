services:
  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:?Set APP_KEY in your shell or a local .env file}
      APP_URL: http://localhost:8000
      PORT: 10000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: university_management
      DB_USERNAME: university
      DB_PASSWORD: university
      DEMO_PASSWORD: "${DEMO_PASSWORD:-ChangeMe123!}"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
    command: ["sh", "-c", "php artisan migrate --force && php artisan db:seed --force && exec /start.sh"]
    ports:
      - "8000:10000"

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: university_management
      POSTGRES_USER: university
      POSTGRES_PASSWORD: university
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U university -d university_management"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - university-postgres:/var/lib/postgresql/data

volumes:
  university-postgres:
